name: build-macos

# Reusable: builds the macOS arm64 app bundle and uploads it as a zip and a dmg.
#
# Homebrew libraries built on a newer macOS can raise the app's effective minimum OS version.
# Set the MACOS_RUNNER repository variable to change the runner, then verify the resulting bundle
# without editing the workflows.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      display:
        description: Human-facing build identity
        type: string
        default: ""
      refspec:
        type: string
        required: true
      tag:
        type: string
        required: true
      release:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: true
      save_cache:
        description: Force-save the compiler and CPM caches at the end of the job
        type: boolean
        default: false
      runner:
        type: string
        default: macos-26

permissions:
  contents: read

jobs:
  build:
    name: macos-arm64
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      PLATFORM: macos-arm64
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup build from checked-out source
        if: hashFiles('.github/actions/setup-build/action.yml') != ''
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}
          save-cache: ${{ inputs.save_cache }}
          display: ${{ inputs.display }}

      - name: Setup build from compatibility pin
        if: hashFiles('.github/actions/setup-build/action.yml') == ''
        uses: Eglantine-Community/Eglantine/.github/actions/setup-build@583b125d5a2a330bc3e04fed213b908db5f6a8f2
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}
          save-cache: ${{ inputs.save_cache }}

      # The packages docs/Deps.md lists for macOS, plus ccache.
      - name: Install macOS dependencies
        shell: bash
        env:
          # The runner image already ships most of these bottles. Without these, brew spends its
          # time updating taps, scanning dependents and upgrading what is already present; with
          # them the install is a no-op for anything the image has.
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts (restore and save)
        if: env.CACHE_SAVE == 'true'
        uses: actions/cache@v6
        with:
          path: |
            build/release/rust-target
            rust/target
          key: rust-v1-${{ env.PLATFORM }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**/*.rs', 'rust/crates/**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ env.PLATFORM }}-

      - name: Cache Rust build artifacts (restore only)
        if: env.CACHE_SAVE != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            build/release/rust-target
            rust/target
          key: rust-v1-${{ env.PLATFORM }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**/*.rs', 'rust/crates/**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ env.PLATFORM }}-

      - name: Run Rust workspace tests
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --locked --offline

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_GPUI=ON \
            -DENABLE_UPDATE_CHECKER=${{ (inputs.release || startsWith(inputs.tag, 'daily-')) && 'ON' || 'OFF' }} \
            -DEGLANTINE_UPDATE_REPO=${{ github.repository }} \
            -DEGLANTINE_RELEASE_PLATFORM=${{ env.PLATFORM }} \
            -DUSE_CCACHE=ON \
            -DNIGHTLY_BUILD=${{ inputs.nightly && 'ON' || 'OFF' }}

      - name: ccache settings
        shell: bash
        run: |
          ccache --version | head -1
          ccache -p | grep -vE '^#' | grep -E '(cache_dir|compiler_check|base_dir|hash_dir|sloppiness|max_size|umask)' || true

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target eglantine yuzu-cmd --parallel
          ccache --show-stats

      # Self-contained app bundle containing the GPUI shell (`eglantine`) and SDL host (`eden-cli`).
      # Ad-hoc signed, not notarized.
      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/eglantine.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources"
          cp build/release/bin/eglantine "$app/Contents/MacOS/eglantine"
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          if [ -f dist/eglantine.icns ]; then
            cp dist/eglantine.icns "$app/Contents/Resources/eglantine.icns"
          fi
          test -x "$app/Contents/MacOS/eglantine"
          test -x "$app/Contents/MacOS/eden-cli"
          for binary in "$app/Contents/MacOS/eglantine" "$app/Contents/MacOS/eden-cli"; do
            test "$(lipo -archs "$binary")" = arm64
          done
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          # Libraries that load their dependencies through @rpath find them in the bundle.
          for program in eglantine eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E '^/(opt/homebrew|usr/local)/'
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # The programs get the entitlements when the
          # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "eglantine-${SHA}-${PLATFORM}.zip"
          ls -la "eglantine-${SHA}-${PLATFORM}.zip"
          # Also ship a .dmg (drag eglantine.app onto Applications).
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/eglantine.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Eglantine" -srcfolder "$dmgdir" -ov -format UDZO \
            "eglantine-${SHA}-${PLATFORM}.dmg"
          ls -la "eglantine-${SHA}-${PLATFORM}.dmg"

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ env.PLATFORM }}-${{ inputs.sha }}
          path: |
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.zip
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
