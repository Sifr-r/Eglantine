name: build-android

# Reusable: builds the Android Snapdragon (arm64-v8a / Adreno / Turnip) APK and uploads it.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      display:
        description: Human-facing build identity
        type: string
        default: ""
      refspec:
        type: string
        required: true
      tag:
        type: string
        required: true
      release:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: true
      save_cache:
        description: Force-save the compiler and CPM caches at the end of the job
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      nightly:
        description: Build as nightly variant
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLATFORM: android-arm64
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

      - name: Install Linux build helpers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache glslang-tools nasm ninja-build pkg-config spirv-tools

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - name: Run Rust workspace tests
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --locked --offline

      - name: Build Android Snapdragon APK (arm64-v8a)
        shell: bash
        env:
          GIT_TAG_NAME: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assembleMainlineRelWithDebInfo \
            -Pnightly=${{ inputs.nightly }} \
            --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ env.PLATFORM }}-${{ env.SHA }}
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
