name: build-linux

# Reusable: builds the Linux binaries (x86_64 and aarch64; with pgo=both also the clang PGO
# variants) and uploads one artifact per platform holding the tar.gz and the AppImage.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      display:
        description: Human-facing build identity (plain variant)
        type: string
        default: ""
      display_pgo:
        description: Human-facing build identity (PGO variant)
        type: string
        default: ""
      refspec:
        type: string
        required: true
      tag:
        type: string
        required: true
      release:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: true
      pgo:
        description: none or both
        type: string
        default: none
      save_cache:
        description: Force-save the compiler and CPM caches at the end of the job
        type: boolean
        default: false

permissions:
  contents: read

# Clang major the PGO build uses, from apt.llvm.org. A profile is written by a current clang and an
# older reader refuses it, so this has to stay at or above whatever produced eglantine.profdata;
# bump it when a refreshed profile needs a newer LLVM.
env:
  PGO_LLVM_VERSION: "23"

jobs:
  build:
    name: linux-${{ matrix.arch }}${{ matrix.pgo && '-pgo' || '' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      PLATFORM: linux-${{ matrix.arch }}${{ matrix.pgo && '-pgo' || '' }}
      SHA: ${{ inputs.sha }}

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        pgo: ${{ fromJSON(inputs.pgo == 'only' && '[true]' || (inputs.pgo == 'both' && '[false, true]' || '[false]')) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup build from checked-out source
        if: hashFiles('.github/actions/setup-build/action.yml') != ''
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}
          save-cache: ${{ inputs.save_cache }}
          display: ${{ matrix.pgo && inputs.display_pgo || inputs.display }}

      - name: Setup build from compatibility pin
        if: hashFiles('.github/actions/setup-build/action.yml') == ''
        uses: Eglantine-Community/Eglantine/.github/actions/setup-build@583b125d5a2a330bc3e04fed213b908db5f6a8f2
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}
          save-cache: ${{ inputs.save_cache }}

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sudo autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build libdrm-dev libx11-dev \
            pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build artifacts (restore and save)
        if: env.CACHE_SAVE == 'true'
        uses: actions/cache@v6
        with:
          path: |
            build/release/rust-target
            rust/target
          key: rust-v1-${{ env.PLATFORM }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**/*.rs', 'rust/crates/**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ env.PLATFORM }}-

      - name: Cache Rust build artifacts (restore only)
        if: env.CACHE_SAVE != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            build/release/rust-target
            rust/target
          key: rust-v1-${{ env.PLATFORM }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/crates/**/*.rs', 'rust/crates/**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ env.PLATFORM }}-

      - name: Run Rust workspace tests
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --locked --offline

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so take clang from the LLVM
      # apt repo. The versioned packages are named explicitly: that repo's unversioned clang/lld
      # metapackages can lag the binaries they depend on and then resolve to nothing. lld-23 only
      # ships ld.lld under /usr/lib/llvm-23/bin, so -B points the linker search there.
      - name: Install clang for PGO
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          codename=$(lsb_release -cs)

          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          "clang-$PGO_LLVM_VERSION" --version

      # The profile is in the source tree, where the configure step reads it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s eglantine.profdata

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DYUZU_USE_BUNDLED_OPENSSL=ON
            -DYUZU_USE_BUNDLED_FFMPEG=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_GPUI=ON
            -DENABLE_UPDATE_CHECKER=${{ (inputs.release || startsWith(inputs.tag, 'daily-')) && 'ON' || 'OFF' }}
            -DEGLANTINE_UPDATE_REPO=${{ github.repository }}
            -DEGLANTINE_RELEASE_PLATFORM=${{ env.PLATFORM }}
            -DUSE_CCACHE=ON
            -DNIGHTLY_BUILD=${{ inputs.nightly && 'ON' || 'OFF' }}
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: ccache settings
        shell: bash
        run: |
          ccache --version | head -1
          ccache -p | grep -vE '^#' | grep -E '(cache_dir|compiler_check|base_dir|hash_dir|sloppiness|max_size|umask)' || true
          if [ '${{ matrix.pgo }}' = 'true' ]; then clang-$PGO_LLVM_VERSION --version | head -1; fi

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target eglantine yuzu-cmd --parallel
          ccache --show-stats -vv

      # Plain tar.gz with the two programs. GitHub artifacts drop the executable bit, so a tar is
      # what keeps it.
      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          strip build/release/bin/eglantine build/release/bin/eden-cli
          tar -czf "eglantine-${SHA}-${PLATFORM}.tar.gz" \
            -C build/release/bin eglantine eden-cli
          ls -la "eglantine-${SHA}-${PLATFORM}.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader).
      # Runs on glibc 2.39+ systems.
      - name: Package AppImage
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)   # aarch64 or x86_64
          # Pinned SHA-256 digests for linuxdeploy (2026-11-01).
          case "$arch" in
            x86_64)
              linuxdeploy_sha256="df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5"
              ;;
            aarch64)
              linuxdeploy_sha256="f38e4d7cebf20d8073ec4e00e0a167ac146cd8585fe2f8fe82df27d74f2bd8e1"
              ;;
            *)
              echo "Unsupported architecture for linuxdeploy: $arch" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          printf '%s  %s\n' \
            "$linuxdeploy_sha256" "$tools/linuxdeploy-$arch.AppImage" | sha256sum -c -
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon dev.eglantine.eglantine.
          icon="$RUNNER_TEMP/dev.eglantine.eglantine.png"
          cp dist/Eglantine.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Embedded in the AppImage metadata: the version label of this build.
          export LDAI_VERSION="$VERSION_LABEL"
          export LDAI_OUTPUT="eglantine-${SHA}-${PLATFORM}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/eglantine \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/dev.eglantine.eglantine.desktop \
            --icon-file "$icon" \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      - name: Check AppImage staging paths
        if: hashFiles('tools/ci/check_release_paths.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          find AppDir -mindepth 1 -printf '%P\0' | \
            python3 -I tools/ci/check_release_paths.py --stdin0

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ env.PLATFORM }}-${{ inputs.sha }}
          path: |
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.tar.gz
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
