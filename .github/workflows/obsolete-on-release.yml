name: Mark issues obsolete on release

on:
  release:
    types: [released] # fires for published stable releases only, not pre-releases or drafts
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name to cite in the comment
        type: string
        required: true

permissions:
  issues: write

jobs:
  mark-obsolete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create obsolete --color CFD3D7 \
            --description "Issue predates the latest release" --force

      - name: Label all open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "TAG is empty" >&2
            exit 1
          fi
          gh issue list --state open --limit 1000 \
            --search '-label:pinned -label:enhancement -label:accessibility -label:deferred -label:help-wanted -label:obsolete no:assignee no:milestone' \
            --json number --jq '.[].number' |
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue edit "$n" --add-label obsolete
            gh issue comment "$n" --body "A new release (\`$TAG\`) is out. Please check if this still applies. If it does, leave a comment within 7 days or this issue will be closed as not planned."
            sleep 1
          done
