name: update-flake-lock

on:
  # Manual only. The weekly schedule used to open a bump PR that nothing ever
  # built -- a GITHUB_TOKEN-authored PR does not trigger ci.yml, and nix.yml is
  # dispatch-only -- so a bump that broke the package would sit there quietly.
  # Run this by hand, then let the branch build before merging the PR.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "Update Nix flake inputs"
          pr-labels: |
            dependencies
            automated
