name: Source checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-paths:
    name: Check repository paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check candidate tree for release exclusions
        shell: bash
        run: git ls-tree -r --name-only -z HEAD | python3 -I tools/ci/check_release_paths.py --stdin0

      - name: Run release path scanner unit tests
        shell: bash
        run: python3 -I tools/ci/test_check_release_paths.py

  catch2:
    name: Linux Catch2 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install headless build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf g++ gcc glslang-tools libglu1-mesa-dev libpulse-dev libtool \
            libudev-dev libxkbcommon-x11-0 mesa-common-dev nasm ninja-build \
            libdrm-dev libx11-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev libboost-dev \
            libboost-fiber-dev libboost-context-dev libopus-dev libasound2-dev

      - name: Configure tests
        shell: bash
        run: |
          cmake --version
          cmake -S . -B build/tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DDYNARMIC_TESTS=OFF \
            -DENABLE_QT=OFF \
            -DENABLE_UPDATE_CHECKER=ON \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON

      - name: Build test executable
        run: cmake --build build/tests --target tests --parallel 4

      - name: Run tests
        run: ctest --test-dir build/tests/src/tests --output-on-failure --no-tests=error
