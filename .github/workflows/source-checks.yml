name: Source checks

on:
  push:
    branches:
      - nx2
      - nx2-experimental
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-paths:
    name: Check repository paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check candidate tree for release exclusions
        shell: bash
        run: git ls-tree -r --name-only -z HEAD | python3 -I tools/ci/check_release_paths.py --stdin0

  docs-layout:
    name: Check documentation layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the documentation tree is kept in this repository
        shell: bash
        run: python3 -I tools/ci/check_docs_layout.py --ref HEAD

  license-headers:
    name: Check SPDX license headers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify modified file SPDX headers
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh tools/ci/license-header.sh --base "origin/$BASE_REF"

  tests:
    name: Linux tests
    uses: ./.github/workflows/test-linux.yml
    with:
      save_cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/nx2' || github.ref == 'refs/heads/nx2-experimental') }}
