[workspace]

[package]
name = "eglantine-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99.1"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gilrs"]

[[bin]]
name = "eglantine-gpui"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
eglantine-library = { path = "../../crates/eglantine_library" }
eglantine-theme = { path = "../../crates/eglantine_theme" }
gpui = { version = "=0.2.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
gilrs = { version = "=0.11.1", optional = true }
