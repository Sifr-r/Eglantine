import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'com.android.application'
}

def edenDir = project(':Eden').projectDir
def isNightly = providers.gradleProperty('nightly').orNull?.toBoolean() ?: false
def autoVersion = (((System.currentTimeMillis() / 1000L) - 1451606400L) / 10L) as int
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace = 'dev.eden.eden_emulator'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'dev.eden.eden_emulator'
        minSdk = 24
        targetSdk = 36
        versionCode = autoVersion
        versionName = System.getenv('GIT_TAG_NAME') ?: '0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                def cmakeArgs = [
                    '-DANDROID_ARM_NEON=true',
                    '-DENABLE_INTEL_XESS=OFF',
                    '-DENABLE_ISPC_KERNELS=OFF',
                    '-DENABLE_MCP_SERVER=OFF',
                    '-DENABLE_SENTRY=OFF',
                    '-DEGLANTINE_RUST_OFFLINE=ON',
                    '-DYUZU_USE_CPM=ON',
                    '-DCPMUTIL_FORCE_BUNDLED=ON',
                    '-DYUZU_DOWNLOAD_ANDROID_VVL=OFF',
                    '-DYUZU_USE_BUNDLED_FFMPEG=ON',
                    '-DYUZU_TESTS=OFF',
                    '-DDYNARMIC_TESTS=OFF',
                ]
                if (isNightly) {
                    cmakeArgs += '-DNIGHTLY_BUILD=ON'
                }
                arguments.addAll(cmakeArgs)
                targets 'eglantine-android', 'eglantine-android-sdl'
            }
        }
    }

    signingConfigs {
        if (keystoreFile != null) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASS')
            }
        }
        create('default') {
            storeFile file("${projectDir}/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig keystoreFile != null ? signingConfigs.getByName('release') : signingConfigs.getByName('default')
            if (isNightly) {
                applicationIdSuffix '.nightly'
            }
            minifyEnabled false
            debuggable false
        }

        relWithDebInfo {
            signingConfig signingConfigs.getByName('default')
            debuggable true
            jniDebuggable true
            versionNameSuffix '-relWithDebInfo'
            applicationIdSuffix '.relWithDebInfo'
        }

        debug {
            signingConfig signingConfigs.getByName('default')
            debuggable true
            jniDebuggable true
            versionNameSuffix '-debug'
            applicationIdSuffix '.debug'
        }
    }

    flavorDimensions += 'version'
    productFlavors {
        mainline {
            dimension 'version'
            isDefault = true
            minSdk = 33
        }
    }

    buildFeatures {
        buildConfig = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            version = '3.31.5'
            path = new File(edenDir, 'CMakeLists.txt')
        }
    }

    packaging {
        // SDLActivity opens libmain.so from ApplicationInfo.nativeLibraryDir, and libadrenotools hooks it.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            java.srcDir(new File(edenDir, 'externals/generated/sdl/java'))
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name.capitalize()
        tasks.withType(JavaCompile).configureEach {
            if (name == "compile${variantName}JavaWithJavac") {
                // CMake supplies the pinned upstream SDL activity sources.
                dependsOn("externalNativeBuild${variantName}")
            }
        }
    }
}
